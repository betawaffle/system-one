{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · ganglion</title>
<link rel="preload" href="{{asset "fonts/ibm-plex-sans-latin-400-normal.woff2"}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "css/base.css"}}">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<script src="{{asset "js/theme.js"}}"></script>
<script type="module" src="{{asset "js/app.js"}}"></script>
{{block "head" .}}{{end}}
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="ganglion home">{{template "logo"}}<span>ganglion</span></a>
  <nav class="nav" aria-label="Main">
    <a href="/" {{if eq .Nav "overview"}}aria-current="page"{{end}}>Overview</a>
    <a href="/events" {{if eq .Nav "events"}}aria-current="page"{{end}}>Events</a>
    <a href="/fields" {{if eq .Nav "fields"}}aria-current="page"{{end}}>Fields</a>
    <a href="/utterances" {{if eq .Nav "utterances"}}aria-current="page"{{end}}>Utterances</a>
    <a href="/ettin" {{if eq .Nav "ettin"}}aria-current="page"{{end}}>Ettin</a>
    <a href="/design" {{if eq .Nav "design"}}aria-current="page"{{end}}>Design</a>
  </nav>
  <span class="spacer"></span>
  <span class="row hide-sm" data-tip="{{if .Worker}}Model worker connected{{else}}Model worker not connected{{end}}"><span class="dot {{if .Worker}}live{{else}}down{{end}}" id="worker-dot"></span></span>
  <div class="seg" id="theme" role="group" aria-label="Theme">
    <button data-theme-set="auto" aria-pressed="true">Auto</button>
    <button data-theme-set="light" aria-pressed="false">Light</button>
    <button data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main class="page">
{{template "content" .}}
</main>
<div class="tip" id="tip" role="tooltip"></div>
</body>
</html>{{end}}
